sqlite_default: &sqlite_default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

postgres_default: &postgres_default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Neon PgBouncer (-pooler) uses transaction pooling, which does not support prepared statements or advisory locks
  prepared_statements: <%= ENV.fetch("DB_PREPARED_STATEMENTS") { !ENV["DATABASE_URL"].to_s.include?("-pooler.") } %>
  advisory_locks: <%= ENV.fetch("DB_ADVISORY_LOCKS") { !ENV["DATABASE_URL"].to_s.include?("-pooler.") } %>

development:
<% if ENV["DATABASE_URL"].to_s.start_with?("postgres") %>
  <<: *postgres_default
  url: <%= ENV["DATABASE_URL"] %>
<% else %>
  <<: *sqlite_default
  database: storage/development.sqlite3
<% end %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
<% if ENV["TEST_DATABASE_URL"].to_s.start_with?("postgres") %>
  <<: *postgres_default
  url: <%= ENV["TEST_DATABASE_URL"] %>
<% else %>
  <<: *sqlite_default
  url: sqlite3:storage/test.sqlite3
<% end %>

# In production, set DATABASE_URL (e.g. Neon PostgreSQL) for single-DB deployment.
# Falls back to local SQLite in storage/ when DATABASE_URL is not supplied.
production:
<% if !ENV["DATABASE_URL"].to_s.strip.empty? %>
  <<: *postgres_default
  url: <%= ENV["DATABASE_URL"] %>
<% else %>
  <<: *sqlite_default
  database: storage/production.sqlite3
<% end %>
